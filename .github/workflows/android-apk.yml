name: Build Android APK & Verify Simulation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"

jobs:
  build-android:
    name: Test Simulation & Export Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build-Tools & Platform-Tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Download & Install Godot ${{ env.GODOT_VERSION }} + Export Templates
        run: |
          mkdir -p /tmp/godot
          cd /tmp/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -O godot.zip
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -O templates.tpz
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -q templates.tpz
          mv templates/* "$TEMPLATE_DIR/"
          godot --version

      - name: Generate Android Debug Keystore & Configure Godot Editor Settings
        run: |
          mkdir -p "$HOME/.config/godot"
          KEYSTORE_PATH="$HOME/.config/godot/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          for SETTINGS_FILE in "$HOME/.config/godot/editor_settings-4.3.tres" "$HOME/.config/godot/editor_settings-4.tres"; do
            cat <<EOF > "$SETTINGS_FILE"
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/debug_keystore = "$KEYSTORE_PATH"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          done

      - name: Import Project Assets & Run Scientific Simulation Test Suite
        run: |
          godot --headless --import
          godot --headless -s res://tests/test_simulation.gd

      - name: Export Signed Android APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" build/android/genesis-divine-sim.apk
          ls -lh build/android/genesis-divine-sim.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: genesis-divine-sim-android-apk
          path: build/android/genesis-divine-sim.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "GENESIS — The Divine Simulation (v1.0.1 - 60 FPS & Contrôles Tactiles Fluides)"
          body: |
            ## ✦ GENESIS — The Divine Simulation (v1.0.1)
            Mise à jour majeure de performances et d'ergonomie :
            - **Fluidité 60 FPS** : Frustum Culling strict, textures Blender optimisées GPU, batching des frontières, throttling UI intelligent.
            - **Déplacement libre & intuitif** : Glisser à 1 doigt en mode Observer, 2 doigts en tout temps, Clic Droit / Espace + Glisser sur PC, et nouveau pavé tactile directionnel en bas à gauche (`◀ ▲ ▼ ▶` + `🎯 Recentrer`).
            - **Téléchargement Android** : Téléchargez et installez **`genesis-divine-sim.apk`** ci-dessous sur votre smartphone ou tablette.
          files: build/android/genesis-divine-sim.apk
